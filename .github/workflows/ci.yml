name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep the public check names stable for the Runtime self-update gate,
        # while pinning Linux to 24.04 so ubuntu-latest cannot drift underneath us.
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: macos-latest
            runner: macos-latest
          - os: macos-15-intel
            runner: macos-15-intel
          - os: windows-latest
            runner: windows-latest

    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node
        if: matrix.os != 'macos-15-intel'
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          cache: true
          install: false

      # pnpm 11 ships no working standalone binary for Intel macOS, so this
      # runner installs the way the README tells users to: Node plus corepack,
      # which runs pnpm's JavaScript build.
      - name: Setup Node (Intel macOS)
        if: matrix.os == 'macos-15-intel'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable corepack pnpm (Intel macOS)
        if: matrix.os == 'macos-15-intel'
        run: corepack enable && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Pi sandbox dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Flyto2 architecture lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
          # Real launchd / Task Scheduler jobs; runners have no service to disturb.
          FLYTO2_NATIVE_SERVICE_TESTS: ${{ matrix.os != 'ubuntu-latest' && '1' || '0' }}
        run: pnpm test

      - name: Package install smoke test
        run: pnpm test:package-install

      - name: Install repository verifier
        if: matrix.os == 'ubuntu-latest'
        run: pipx install flyto-indexer

      - name: Verify repository
        if: matrix.os == 'ubuntu-latest'
        run: flyto-index verify . --full-scan --strict --json

      - name: Doctor
        run: node dist/cli.js doctor
